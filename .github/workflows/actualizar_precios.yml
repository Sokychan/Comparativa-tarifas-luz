name: Actualizar Tarifas de Luz

on:
  schedule:
    - cron: '0 8 * * *' # Se ejecuta todos los días a las 08:00 AM (UTC)
  workflow_dispatch: # Permite que puedas lanzarlo manualmente desde la pestaña "Actions" de GitHub cuando quieras

jobs:
  actualizar:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write # Permiso necesario para que GitHub Actions pueda hacer commit y push automático

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          # Si en el futuro usas librerías de scraping como requests o beautifulsoup4, ponlas aquí:
          # pip install requests beautifulsoup4

      - name: Ejecutar script de actualización de precios
        run: python actualizar_tarifas.py

      - name: Guardar y subir cambios al repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add tarifas.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Actualización automática de tarifas de luz" && git push)
