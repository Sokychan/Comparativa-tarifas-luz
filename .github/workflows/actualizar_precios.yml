name: Actualizar Tarifas de Luz

on:
  schedule:
    - cron: '*/5 * * * *' # Se ejecuta cada 5 minutos (mínimo permitido por GitHub)
  workflow_dispatch: # Permite lanzarlo manualmente desde la pestaña "Actions"
  
jobs:
  actualizar:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write # Permiso necesario para hacer commit y push automático

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Ejecutar script de actualización de precios
        run: python actualizar_tarifas.py

      - name: Guardar y subir cambios al repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add tarifas.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Actualización automática de tarifas de luz" && git push)
